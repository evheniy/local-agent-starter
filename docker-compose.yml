services:
  api:
    image: local-agent-api
    build:
      context: .
      dockerfile: workspaces/api/Dockerfile
    container_name: api
    restart: unless-stopped
    environment:
      PORT: 3000
      LOG_LEVEL: info
      NODE_ENV: production
      DOCS_DIR: /app/docs
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lmstudio}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:1234}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      LLM_PROVIDER: ${LLM_PROVIDER:-lmstudio}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder-7b-instruct}
      UI: /static
    ports:
      - '${API_PORT}:3000'
    volumes:
      - ./docker/docs:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  chat:
    image: local-agent-chat
    build:
      context: .
      dockerfile: workspaces/chat/Dockerfile
    container_name: chat
    restart: unless-stopped
    environment:
      PORT: 3000
      LOG_LEVEL: info
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lmstudio}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:1234}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      LLM_PROVIDER: ${LLM_PROVIDER:-lmstudio}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder-7b-instruct}
    ports:
      - '${CHAT_PORT}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  indexer:
    image: local-agent-indexer
    build:
      context: .
      dockerfile: workspaces/indexer/Dockerfile
    container_name: indexer
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      NODE_ENV: production
      DOCS_DIR: /app/docs
      INDEXER_POLL_MS: ${INDEXER_POLL_MS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lmstudio}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:1234}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
    volumes:
      - ./docker/docs:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  mcp:
    image: local-agent-mcp
    build:
      context: .
      dockerfile: workspaces/mcp/Dockerfile
    container_name: mcp
    restart: unless-stopped
    environment:
      PORT: 3000
      LOG_LEVEL: info
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lmstudio}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:1234}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      LLM_PROVIDER: ${LLM_PROVIDER:-lmstudio}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder-7b-instruct}
    ports:
      - '${MCP_PORT}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  postgres:
    image: pgvector/pgvector:pg18
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${PG_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - appnet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT}:80'
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  postgres-data: {}
